<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نقطة البيع - تسجيل الدخول</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --card2:#FFFFFF;
    --text:#1C1C1E; --text2:#8E8E93; --divider:#E5E5EA;
    --accent:#007AFF; --accent2:#34C759; --danger:#FF3B30; --warn:#FF9500;
    --tab-bg: rgba(249,249,249,.82); --nav-blur: saturate(180%) blur(20px);
    --radius:16px; --radius-sm:10px; --shadow: 0 1px 3px rgba(0,0,0,.06);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  [data-theme="dark"]{
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E;
    --text:#FFFFFF; --text2:#98989D; --divider:#38383A;
    --accent:#0A84FF; --accent2:#30D158; --danger:#FF453A; --warn:#FF9F0A;
    --tab-bg: rgba(28,28,30,.82); --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
    overscroll-behavior-y:none; transition:background .25s ease, color .25s ease;
  }
  button, input, select, textarea{ font-family:inherit; }

  /* Auth Screen Styles */
  #authScreen{
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:var(--bg);
  }
  .auth-card{
    background:var(--card); width:100%; max-width:400px; padding:30px 24px; border-radius:var(--radius);
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px;
  }
  .auth-card h2{margin:0 0 10px; font-size:24px; font-weight:700; text-align:center;}
  .auth-toggle{text-align:center; font-size:13.5px; color:var(--accent); cursor:pointer; margin-top:6px;}

  #mobileApp{max-width:560px; margin:0 auto; min-height:100%; position:relative; padding-bottom:calc(78px + var(--safe-b));}

  header.top{
    position:sticky; top:0; z-index:20; background:var(--tab-bg); backdrop-filter:var(--nav-blur); -webkit-backdrop-filter:var(--nav-blur);
    padding:14px 16px 10px; border-bottom:1px solid var(--divider);
  }
  header.top h1{font-size:22px; font-weight:700; margin:0; letter-spacing:.2px;}
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:none; background:var(--card2);
    display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn svg{width:18px; height:18px;}

  .search{
    display:flex; align-items:center; gap:8px; background:var(--card2);
    border-radius:12px; padding:9px 12px; color:var(--text2);
  }
  .search input{border:none; outline:none; background:transparent; color:var(--text); font-size:15px; width:100%;}
  .search svg{width:16px; height:16px; flex:none;}
  header.top .search{margin-top:10px;}

  .chips{display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; padding:7px 14px; border-radius:100px; background:var(--card2); color:var(--text2); font-size:13.5px; border:none; cursor:pointer;}
  .chip.active{background:var(--accent); color:#fff;}

  main.mobile-main{padding:8px 16px 24px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
  .product-card{
    background:var(--card); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:6px; cursor:pointer; user-select:none; position:relative;
  }
  .product-card:active{transform:scale(.97);}
  .p-img-wrap{width:100%; height:110px; border-radius:12px; background:var(--card2); overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .p-img-wrap img{width:100%; height:100%; object-fit:cover;}
  .p-img-wrap svg{width:36px; height:36px; color:var(--text2); opacity:.5;}
  .p-name{font-size:14.5px; font-weight:600; line-height:1.3; margin-top:4px;}
  .p-sub{font-size:12px; color:var(--text2);}
  .p-price{font-size:15px; font-weight:700; color:var(--accent); margin-top:2px;}
  .stock-badge{position:absolute; top:10px; left:10px; font-size:10px; padding:2px 7px; border-radius:100px; background:var(--card2); color:var(--text2); font-weight:600; z-index:2;}
  .stock-badge.low{color:#fff; background:var(--danger);}

  .section-title{font-size:20px; font-weight:700; margin:14px 2px 6px;}
  .list-row{
    background:var(--card); border-radius:var(--radius); padding:12px 14px; display:flex; align-items:center;
    justify-content:space-between; gap:10px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .list-row .info{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; cursor:pointer;}
  .list-row .title{font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .list-row .sub{font-size:12.5px; color:var(--text2);}
  .row-actions{display:flex; gap:6px; flex:none;}
  .mini-btn{border:none; background:var(--card2); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer;}
  .mini-btn svg{width:15px; height:15px;}
  .mini-btn.danger{color:var(--danger);}

  .fab{
    position:fixed; left:16px; bottom:calc(96px + var(--safe-b)); width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; box-shadow:0 6px 16px rgba(0,122,255,.4); display:flex;
    align-items:center; justify-content:center; z-index:15; cursor:pointer;
  }
  .fab svg{width:24px; height:24px;}
  .fab:active{transform:scale(.93);}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto;
    background:var(--tab-bg); backdrop-filter:var(--nav-blur); -webkit-backdrop-filter:var(--nav-blur);
    border-top:1px solid var(--divider); display:flex; padding:8px 4px calc(8px + var(--safe-b)); z-index:20;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text2); font-size:10px; cursor:pointer; padding:4px 0;
  }
  nav.tabbar button svg{width:21px; height:21px;}
  nav.tabbar button.active{color:var(--accent);}

  .cart-bar{
    position:fixed; bottom:calc(70px + var(--safe-b)); left:16px; right:16px; max-width:528px; margin:0 auto;
    background:var(--accent); color:#fff; border-radius:16px; padding:13px 16px; display:flex; align-items:center;
    justify-content:space-between; box-shadow:0 8px 20px rgba(0,122,255,.35); z-index:16; cursor:pointer;
  }
  .cart-bar b{font-size:14px;}
  .cart-bar .badge{background:rgba(255,255,255,.25); border-radius:100px; padding:2px 9px; font-size:12px; margin-left:6px;}

  .sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; display:none; align-items:flex-end; justify-content:center;}
  .sheet-overlay.show{display:flex;}
  .sheet-overlay.centered{align-items:center;}
  .sheet{
    background:var(--bg); width:100%; max-width:560px; border-radius:20px 20px 0 0; padding:10px 18px 28px;
    max-height:88vh; overflow-y:auto; animation:up .25s ease;
  }
  .sheet-overlay.centered .sheet{border-radius:20px; max-width:480px; animation:pop .18s ease;}
  @keyframes up{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  @keyframes pop{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}
  .sheet-handle{width:36px; height:5px; background:var(--divider); border-radius:100px; margin:4px auto 14px;}
  .sheet-overlay.centered .sheet-handle{display:none;}
  .sheet h2{font-size:19px; margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text2); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--divider); background:var(--card);
    color:var(--text); font-size:15px; outline:none;
  }
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  .btn{
    width:100%; padding:14px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-size:16px;
    font-weight:600; cursor:pointer;
  }
  .btn.secondary{background:var(--card2); color:var(--text);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn:active{transform:scale(.98);}
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn-small{padding:9px 16px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .btn-small svg{width:15px; height:15px;}

  .cart-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--divider);}
  .cart-line .ci-info{flex:1; min-width:0;}
  .cart-line .ci-name{font-size:14.5px; font-weight:600;}
  .cart-line .ci-price{font-size:12.5px; color:var(--text2);}
  .qty-ctrl{display:flex; align-items:center; gap:8px; background:var(--card2); border-radius:100px; padding:4px 8px;}
  .qty-ctrl button{border:none; background:none; width:22px; height:22px; color:var(--accent); font-size:17px; font-weight:700; cursor:pointer;}
  .qty-ctrl span{min-width:16px; text-align:center; font-size:14px; font-weight:600;}
  .cart-total-row{display:flex; justify-content:space-between; padding:14px 0; font-size:16px; font-weight:700;}

  .switch{position:relative; width:51px; height:31px; flex:none;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--divider); border-radius:100px; cursor:pointer; transition:.2s;}
  .slider:before{content:""; position:absolute; width:27px; height:27px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch input:checked + .slider{background:var(--accent2);}
  [dir="rtl"] .switch input:checked + .slider:before{transform:translateX(-20px);}

  .empty{text-align:center; color:var(--text2); padding:50px 20px; font-size:14.5px;}
  .empty svg{width:48px; height:48px; margin-bottom:10px; opacity:.5;}

  .settings-row{display:flex; align-items:center; justify-content:space-between; background:var(--card); padding:14px; border-radius:var(--radius); margin-bottom:10px; box-shadow:var(--shadow);}
  .settings-row .label{font-size:15px; font-weight:500;}
  .settings-row .label .d{font-size:12px; color:var(--text2); margin-top:2px;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
  .stat-card{background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
  .stat-card .v{font-size:22px; font-weight:700;}
  .stat-card .l{font-size:12.5px; color:var(--text2); margin-top:2px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .bar-row .bl{width:110px; font-size:13px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1; height:10px; background:var(--card2); border-radius:100px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:100px;}
  .bar-val{font-size:12.5px; color:var(--text2); flex:none; width:50px; text-align:left;}

  .chart-box{background:var(--card); border-radius:var(--radius); padding:16px; margin-top:14px; box-shadow:var(--shadow);}
  .chart-box h4{margin:0 0 12px; font-size:15px;}

  .toast{
    position:fixed; bottom:calc(100px + var(--safe-b)); left:50%; transform:translateX(-50%); background:var(--text);
    color:var(--bg); padding:10px 18px; border-radius:100px; font-size:13.5px; z-index:60; opacity:0; transition:opacity .25s, transform .25s;
    pointer-events:none; white-space:nowrap; max-width:90%; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .loading{display:flex; align-items:center; justify-content:center; height:70vh; color:var(--text2); font-size:14px;}

  .scanner-wrap{position:fixed; inset:0; background:#000; z-index:50; display:none; flex-direction:column;}
  .scanner-wrap.show{display:flex;}
  .scanner-top{display:flex; justify-content:space-between; align-items:center; padding:16px; color:#fff;}
  .scanner-video-box{position:relative; flex:1; overflow:hidden; max-width:640px; width:100%; margin:0 auto;}
  .scanner-video-box video{width:100%; height:100%; object-fit:cover;}
  .scan-frame{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:84%; max-width:440px; aspect-ratio:3/2; border:3px solid #fff; border-radius:16px; box-shadow:0 0 0 2000px rgba(0,0,0,.5); overflow:hidden;}
  .scan-line{position:absolute; left:4%; right:4%; top:6%; height:2px; background:linear-gradient(90deg, transparent, #30D158, transparent); box-shadow:0 0 8px #30D158; animation:scanmove 1.7s ease-in-out infinite;}
  @keyframes scanmove{0%{top:6%;} 50%{top:92%;} 100%{top:6%;}}
  .scanner-hint{color:#fff; text-align:center; padding:14px 16px 4px; font-size:13.5px; opacity:.9;}
  .manual-entry-wrap{display:flex; justify-content:center; padding:10px 16px 20px;}

  #desktopApp{display:flex; min-height:100vh;}
  .dash-sidebar{
    width:232px; flex:none; background:var(--card); border-inline-end:1px solid var(--divider);
    padding:20px 14px; display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .dash-logo{display:flex; align-items:center; gap:10px; padding:8px 10px 22px; font-size:18px; font-weight:700;}
  .dash-logo span.dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none;}
  .dash-nav-group{font-size:11px; color:var(--text2); font-weight:600; padding:14px 12px 6px;}
  .dash-nav-btn{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:11px; border:none;
    background:transparent; color:var(--text2); font-size:14px; cursor:pointer; text-align:right; width:100%;
  }
  .dash-nav-btn svg{width:19px; height:19px; flex:none;}
  .dash-nav-btn:hover{background:var(--card2);}
  .dash-nav-btn.active{background:var(--accent); color:#fff;}
  .dash-sidebar-bottom{margin-top:auto; padding-top:14px; border-top:1px solid var(--divider);}

  .dash-main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .dash-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 32px;
    border-bottom:1px solid var(--divider); position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .dash-topbar h1{font-size:21px; margin:0; font-weight:700;}
  .dash-topbar-actions{display:flex; align-items:center; gap:10px;}
  .dash-search{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--divider);
    border-radius:11px; padding:8px 12px; width:260px; color:var(--text2);
  }
  .dash-search input{border:none; outline:none; background:transparent; color:var(--text); font-size:14px; width:100%;}
  .dash-search svg{width:15px; height:15px; flex:none;}

  .dash-content{padding:26px 32px 50px; flex:1;}
  .dash-toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px;}
  .dash-chips{display:flex; gap:8px; flex-wrap:wrap;}

  .pos-layout{display:flex; gap:22px; align-items:flex-start;}
  .pos-products{flex:1; min-width:0;}
  .pos-products .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px;}
  .order-panel{
    width:340px; flex:none; background:var(--card); border-radius:var(--radius); padding:18px;
    position:sticky; top:96px; box-shadow:var(--shadow); max-height:calc(100vh - 116px); display:flex; flex-direction:column;
  }
  .order-panel h3{margin:0 0 12px; font-size:16px; display:flex; align-items:center; justify-content:space-between;}
  .order-panel .count-pill{font-size:11.5px; background:var(--card2); color:var(--text2); padding:2px 9px; border-radius:100px; font-weight:600;}
  .order-lines{flex:1; overflow-y:auto; margin-bottom:10px; min-height:60px;}

  .dash-table-wrap{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .dash-table{width:100%; border-collapse:collapse;}
  .dash-table th{text-align:right; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text2); font-weight:600; padding:13px 18px; border-bottom:1px solid var(--divider);}
  .dash-table td{padding:13px 18px; border-bottom:1px solid var(--divider); font-size:14px;}
  .dash-table tr:last-child td{border-bottom:none;}
  .dash-table tr:hover td{background:var(--card2);}
  .cell-main{font-weight:600;}
  .cell-sub{font-size:12px; color:var(--text2); margin-top:1px;}
  .table-actions{display:flex; gap:6px; justify-content:flex-end;}
  .pill{display:inline-block; padding:3px 10px; border-radius:100px; font-size:12px; font-weight:600; background:var(--card2); color:var(--text2);}
  .pill.low{background:var(--danger); color:#fff;}

  .dash-stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
  .dash-stat-card{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .dash-stat-card .v{font-size:24px; font-weight:700;}
  .dash-stat-card .l{font-size:12.5px; color:var(--text2); margin-top:3px;}
  .dash-panels{display:flex; gap:20px; align-items:flex-start;}
  .dash-panel{background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); flex:1;}
  .dash-panel h3{margin:0 0 14px; font-size:16px;}

  .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

  @media print {
    body * { visibility: hidden; }
    #printableInvoice, #printableInvoice * { visibility: visible; }
    #printableInvoice { position: absolute; left: 0; top: 0; width: 100%; background: #fff; color: #000; padding: 20px; }
  }
</style>
</head>
<body data-theme="light">

<div id="authScreen" style="display:none;">
  <div class="auth-card">
    <h2 id="authTitle">تسجيل الدخول</h2>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="authEmail" placeholder="name@example.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>
    <button class="btn" id="authSubmitBtn" onclick="handleAuthSubmit()">دخول</button>
    <div class="auth-toggle" onclick="toggleAuthMode()" id="authToggleText">ليس لديك حساب؟ إنشاء حساب جديد</div>
  </div>
</div>

<div id="mobileApp" style="display:none;"><div class="loading">جاري التحميل...</div></div>
<div id="desktopApp" style="display:none;"></div>
<div id="rootLoading" class="loading">جاري التحميل...</div>

<div class="toast" id="toast"></div>
<div class="sheet-overlay" id="sheetOverlay"><div class="sheet" id="sheetContent"></div></div>

<div class="scanner-wrap" id="scannerWrap">
  <div class="scanner-top">
    <button class="icon-btn" onclick="closeScanner()" style="background:rgba(255,255,255,.15); color:#fff;">✕</button>
    <span style="font-weight:600;">امسح كود المنتج</span>
    <button class="icon-btn" id="torchBtn" onclick="toggleTorch()" style="background:rgba(255,255,255,.15); color:#fff; display:none;"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"/></svg></button>
  </div>
  <div class="scanner-video-box">
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-frame"><div class="scan-line"></div></div>
  </div>
  <div class="scanner-hint">وجّه الكاميرا نحو الباركود أو رمز QR بحيث يملأ الإطار، وثبّت يدك لثانية</div>
  <div class="manual-entry-wrap"><button class="btn-small" onclick="openManualCodeEntry()">إدخال الكود يدويًا</button></div>
</div>

<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDCRbSO8WpdD92eAW5GoSyuc1vlcJP2I38",

/* =====================================================================
   SOUND EFFECTS SYSTEM (Web Audio API - Professional Tone)
   ===================================================================== */
let audioCtx = null;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type){
  try{
    initAudio();
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if(type === 'click'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.04);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      osc.start(now);
      osc.stop(now + 0.04);
    } else if(type === 'success'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if(type === 'delete'){
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    }
  }catch(e){console.error(e);}
}

async function loadAll(){
  if(!window.currentUid) return;
  const docRef = window.fsDoc(window.db, 'usersData', window.currentUid);
  
  if(window.unsubscribeUserDoc) window.unsubscribeUserDoc();
  
  window.unsubscribeUserDoc = window.fsOnSnapshot(docRef, async (docSnap)=>{
    if(docSnap.exists()){
      const d = docSnap.data();
      state.products = d.products || seedProducts();
      state.customers = d.customers || [{id:uid(), name:'عملاء الجملة', phone:'01000000000'}];
      state.sales = d.sales || [];
      state.categories = d.categories || ['مشروبات', 'مأكولات', 'حلويات'];
      state.theme = d.theme || 'light';
      state.currency = d.currency || 'ج.م';
      state.adminPin = d.adminPin || '';
    } else {
      state.products = seedProducts();
      state.customers = [{id:uid(), name:'عملاء الجملة', phone:'01000000000'}];
      state.sales = [];
      state.categories = ['مشروبات', 'مأكولات', 'حلويات'];
      state.theme = 'light';
      state.currency = 'ج.م';
      state.adminPin = '';
      await saveAllToFirebase();
    }
    
    // التحقق من الصلاحية الحالية لو تم إغلاق صفحات غير مسموحة
    const allowed = getAvailableTabs();
    if(!allowed.some(t => t.id === state.view)){
      state.view = 'sales';
    }

    applyTheme();
    render();
  }, (err)=>{
    console.error("Firestore sync error:", err);
    toast('خطأ في مزامنة البيانات');
  });
}

async function saveAllToFirebase(){
  if(!window.currentUid) return;
  const docRef = window.fsDoc(window.db, 'usersData', window.currentUid);
  const payload = {
    products: state.products,
    customers: state.customers,
    sales: state.sales,
    categories: state.categories,
    theme: state.theme,
    currency: state.currency,
    adminPin: state.adminPin
  };
  try {
    await window.fsSetDoc(docRef, payload, {merge:true});
  } catch(e){
    console.error(e);
    toast('فشل الحفظ في السحابة');
  }
}

  return cats.map(c=>`<button class="chip ${state.cat===c?'active':''}" onclick="state.cat='${c}'; render()">${c}</button>`).join('');

function filteredProducts(q){
  const s = (q !== undefined ? q : state.search).toLowerCase();
  return state.products.filter(p=>{
    const matchCat = (state.cat==='الكل' || p.category===state.cat);
    const matchName = p.name.toLowerCase().includes(s) || (p.code && p.code.toLowerCase().includes(s));
    return matchCat && matchName;
  });
}

function addToCart(id){
  playSound('click');
  const p = state.products.find(x=>x.id===id);
  if(!p || p.stock<=0){ toast('المنتج نفد من المخزون!'); return; }
  const existing = state.cart.find(x=>x.id===id);
  if(existing){
    if(existing.qty >= p.stock){ toast('الكمية المطلوبة تتجاوز المخزون المتاح'); return; }
    existing.qty++;
  } else {
    state.cart.push({id:p.id, name:p.name, price:p.price, qty:1});
  }
  render();
}

function updateCartQty(id, delta){
  playSound('click');
  const item = state.cart.find(x=>x.id===id);
  if(!item) return;
  const p = state.products.find(x=>x.id===id);
  item.qty += delta;
  if(item.qty<=0){
    state.cart = state.cart.filter(x=>x.id!==id);
  } else if(p && item.qty > p.stock){
    item.qty = p.stock;
    toast('وصلت للحد الأقصى للمخزون');
  }
  render();
}

  return state.cart.reduce((s,l)=>s + (l.price * l.qty), 0);

async function saveQuickCustomer(){
  const name = document.getElementById('qCustName').value.trim();
  const phone = document.getElementById('qCustPhone').value.trim();
  if(!name){ toast('الرجاء إدخال اسم العميل'); return; }
  const newCust = {id:uid(), name, phone};
  state.customers.push(newCust);
  state.selectedCustomerId = newCust.id;
  state.customerModalSearch = '';
  await saveAllToFirebase();
  playSound('success');
  openCheckoutSheet();
  toast('تمت إضافة العميل واختياره');
}

async function confirmSale(){
  if(!state.cart.length) return;
  const items = state.cart.map(l=>{
    const p = state.products.find(x=>x.id===l.id);
    if(p) p.stock -= l.qty;
    return {id:l.id, name:l.name, price:l.price, qty:l.qty};
  });
  const sale = {
    id: uid(),
    items,
    total: cartTotal(),
    customerId: state.selectedCustomerId,
    payMethod: window.__payMethod || 'نقدي',
    date: new Date().toISOString()
  };
  state.sales.push(sale);
  state.cart = [];
  state.selectedCustomerId = null;
  await saveAllToFirebase();
  playSound('success');
  closeSheet();
  render();
  toast('تم الدفع بنجاح ✓');
}

function handleImageUpload(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    window.__tempProductImage = e.target.result;
    const preview = document.getElementById('imagePreviewContainer');
    if(preview){
      preview.innerHTML = `<img src="${window.__tempProductImage}" style="width:100%; height:100%; object-fit:cover;">`;
    }
  };
  reader.readAsDataURL(file);
}

async function saveProduct(id){
  const name = document.getElementById('fName').value.trim();
  const price = parseFloat(document.getElementById('fPrice').value);
  const stock = parseInt(document.getElementById('fStock').value);
  const category = document.getElementById('fCat').value;
  const code = document.getElementById('fCode').value.trim();
  const image = window.__tempProductImage || '';

  if(!name || isNaN(price) || isNaN(stock)){
    toast('الرجاء إدخال البيانات الأساسية بشكل صحيح');
    return;
  }

  if(id){
    const p = state.products.find(x=>x.id===id);
    if(p) Object.assign(p, {name, price, stock, category, code, image});
  } else {
    state.products.push({id:uid(), name, price, stock, category, code, image});
  }

  await saveAllToFirebase();
  playSound('success');
  closeSheet();
  render();
  toast('تم حفظ المنتج بنجاح');
}

async function deleteProduct(id){
  playSound('delete');
  state.products = state.products.filter(p=>p.id!==id);
  await saveAllToFirebase();
  render();
  toast('تم حذف المنتج');
}

/* =====================================================================
   REPORTS MODULE
   ===================================================================== */
function computeReportData(){
  const today = new Date().toDateString();
  const todaySales = state.sales.filter(s=> new Date(s.date).toDateString()===today);
  const todayTotal = todaySales.reduce((s,x)=>s+x.total,0);
  const totalAll = state.sales.reduce((s,x)=>s+x.total,0);

  const qtyMap = {};
  state.sales.forEach(s=> s.items.forEach(it=>{
    qtyMap[it.name]=(qtyMap[it.name]||0)+it.qty;
  }));
  const top = Object.entries(qtyMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const monthlyMap = {};
  const yearlyMap = {};
  state.sales.forEach(s=>{
    const d = new Date(s.date);
    const mKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const yKey = `${d.getFullYear()}`;
    monthlyMap[mKey] = (monthlyMap[mKey]||0) + s.total;
    yearlyMap[yKey] = (yearlyMap[yKey]||0) + s.total;
  });

  const months = Object.entries(monthlyMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);
  const years = Object.entries(yearlyMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-5);

  return {todaySales, todayTotal, totalAll, top, months, years};
}

function renderReportsBody(){
  const {todaySales, todayTotal, totalAll, top} = computeReportData();
  const maxQty = top.length? top[0][1] : 1;
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="v">${todayTotal} ${state.currency}</div><div class="l">مبيعات اليوم</div></div>
      <div class="stat-card"><div class="v">${todaySales.length}</div><div class="l">فواتير اليوم</div></div>
      <div class="stat-card"><div class="v">${totalAll} ${state.currency}</div><div class="l">إجمالي المبيعات</div></div>
      <div class="stat-card"><div class="v">${state.sales.length}</div><div class="l">إجمالي الفواتير</div></div>
    </div>
    <div class="chart-box">
      <h4>الأكثر مبيعًا</h4>

        <div class="bar-row">

          <div class="bar-track"><div class="bar-fill" style="width:${(qty/maxQty)*100}%"></div></div>

        </div>
      `).join('') : '<div class="empty" style="padding:20px;">لا توجد بيانات كافية</div>'}
    </div>
  `;
}

  const {todaySales, todayTotal, totalAll, top, months, years} = computeReportData();
  const maxQty = top.length? top[0][1] : 1;
  const maxMonthVal = months.length ? Math.max(...months.map(m=>m[1])) : 1;

            <div class="bar-val">${qty} قطع</div>

async function saveNewAdminPin(hasPin){
  const newPin = document.getElementById('newPinInput').value.trim();
  if(!newPin){
    toast('الرجاء إدخال الكود الجديد');
    return;

  if(hasPin){
    const oldPin = document.getElementById('oldPinInput').value.trim();
    if(oldPin !== state.adminPin){

      return;
    }

  await saveAllToFirebase();
  playSound('success');
  closeSheet();

  if(state.categories.includes(name)){ toast('الفئة موجودة مسبقاً'); return; }

  playSound('click');

async function updateCategory(oldName){
  const newName = document.getElementById('editCatName').value.trim();
  if(!newName){ toast('أدخل اسم الفئة'); return; }
  const idx = state.categories.indexOf(oldName);
  if(idx !== -1){
    state.categories[idx] = newName;
    state.products.forEach(p=>{ if(p.category===oldName) p.category=newName; });
    await saveAllToFirebase();
    playSound('success');
    closeSheet();
    render();
    toast('تم التعديل');
  }
}

async function deleteCategory(name){

    playSound('delete');
    state.categories = state.categories.filter(c=>c!==name);
    await saveAllToFirebase();
    render();
    toast('تم الحذف');
  }
}

/* =====================================================================
   BARCODE SCANNER MODULE (ZXing)
   ===================================================================== */
let zxingCodeReader = null;
let zxingControls = null;
let currentVideoTrack = null;
let torchOn = false;

function openScanner(){
  playSound('click');
  const wrap = document.getElementById('scannerWrap');
  wrap.classList.add('show');
  startZxingScanner();
}

function startZxingScanner(){
  if(!window.ZXing){
    toast('مكتبة الباركود غير محملة');
    return;
  }
  if(!zxingCodeReader){
    zxingCodeReader = new window.ZXing.BrowserBarcodeReader();
  }
  zxingCodeReader.decodeFromVideoDevice(null, 'scanVideo', (result, err)=>{
    if(result){
      onScanResult(result.getText());
    }
    if(err && err.name !== 'NotFoundException'){
      // console.error(err);
    }
  }).then(controls => {
    zxingControls = controls;
    const videoEl = document.getElementById('scanVideo');
    if(videoEl && videoEl.srcObject){
      currentVideoTrack = videoEl.srcObject.getVideoTracks()[0];
      const torchBtn = document.getElementById('torchBtn');
      if(currentVideoTrack && currentVideoTrack.getCapabilities && currentVideoTrack.getCapabilities().torch){
        torchBtn.style.display = 'flex';
      } else {
        torchBtn.style.display = 'none';
      }
    }
  }).catch(e=>{
    console.error(e);
    toast('تعذر تشغيل الكاميرا');
  });
}

function toggleTorch(){
  if(!currentVideoTrack) return;
  torchOn = !torchOn;
  try{
    currentVideoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
  }catch(e){
    console.error('الفلاش غير مدعوم على هذا الجهاز', e);
    toast('الفلاش غير مدعوم على هذا الجهاز');
  }
}

function onScanResult(data){
  closeScanner();
  const clean = (data || '').trim();
  const p = state.products.find(pr=> pr.code===clean);
  if(p){ addToCart(p.id); }
  else toast(`لم يتم العثور على منتج بالكود: ${clean.slice(0,20)}`);
}

function closeScanner(){
  document.getElementById('scannerWrap').classList.remove('show');
  if(zxingControls){ try{ zxingControls.stop(); }catch(e){} zxingControls = null; }
  currentVideoTrack = null;
  torchOn = false;
}

function openManualCodeEntry(){
  closeScanner();
  playSound('click');
  openSheet(`
    <h2>إدخال كود المنتج يدويًا</h2>
    <div class="field"><label>كود المنتج</label><input id="manualCodeInput" placeholder="اكتب الكود المطبوع على المنتج" inputmode="numeric"></div>
    <button class="btn" onclick="submitManualCode()">بحث وإضافة للسلة</button>
    <div class="btn-row"><button class="btn secondary" onclick="closeSheet()">إلغاء</button></div>
  `);
  setTimeout(()=>{ const el = document.getElementById('manualCodeInput'); if(el) el.focus(); }, 60);
}

function submitManualCode(){
  const el = document.getElementById('manualCodeInput');
  if(!el) return;
  const clean = el.value.trim();
  closeSheet();
  const p = state.products.find(pr=>pr.code===clean);
  if(p){ addToCart(p.id); }
  else toast(`لم يتم العثور على منتج بالكود: ${clean}`);
}

function escapeAttr(str){
  if(!str) return '';
  return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
