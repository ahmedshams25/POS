<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نقطة البيع - تسجيل الدخول</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --card2:#FFFFFF;
    --text:#1C1C1E; --text2:#8E8E93; --divider:#E5E5EA;
    --accent:#007AFF; --accent2:#34C759; --danger:#FF3B30; --warn:#FF9500;
    --tab-bg: rgba(249,249,249,.82); --nav-blur: saturate(180%) blur(20px);
    --radius:16px; --radius-sm:10px; --shadow: 0 1px 3px rgba(0,0,0,.06);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  [data-theme="dark"]{
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E;
    --text:#FFFFFF; --text2:#98989D; --divider:#38383A;
    --accent:#0A84FF; --accent2:#30D158; --danger:#FF453A; --warn:#FF9F0A;
    --tab-bg: rgba(28,28,30,.82); --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,Arial,sans-serif;
    overscroll-behavior-y:none; transition:background .25s ease, color .25s ease;
  }
  button, input, select, textarea{ font-family:inherit; }

  /* Auth Screen Styles */
  #authScreen{
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:var(--bg);
  }
  .auth-card{
    background:var(--card); width:100%; max-width:400px; padding:30px 24px; border-radius:var(--radius);
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:16px;
  }
  .auth-card h2{margin:0 0 10px; font-size:24px; font-weight:700; text-align:center;}
  .auth-toggle{text-align:center; font-size:13.5px; color:var(--accent); cursor:pointer; margin-top:6px;}

  #mobileApp{max-width:560px; margin:0 auto; min-height:100%; position:relative; padding-bottom:calc(78px + var(--safe-b));}

  header.top{
    position:sticky; top:0; z-index:20; background:var(--tab-bg); backdrop-filter:var(--nav-blur); -webkit-backdrop-filter:var(--nav-blur);
    padding:14px 16px 10px; border-bottom:1px solid var(--divider);
  }
  header.top h1{font-size:22px; font-weight:700; margin:0; letter-spacing:.2px;}
  .top-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:none; background:var(--card2);
    display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn svg{width:18px; height:18px;}

  .search{
    display:flex; align-items:center; gap:8px; background:var(--card2);
    border-radius:12px; padding:9px 12px; color:var(--text2);
  }
  .search input{border:none; outline:none; background:transparent; color:var(--text); font-size:15px; width:100%;}
  .search svg{width:16px; height:16px; flex:none;}
  header.top .search{margin-top:10px;}

  .chips{display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none; padding:7px 14px; border-radius:100px; background:var(--card2); color:var(--text2); font-size:13.5px; border:none; cursor:pointer;}
  .chip.active{background:var(--accent); color:#fff;}

  main.mobile-main{padding:8px 16px 24px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
  .product-card{
    background:var(--card); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:6px; cursor:pointer; user-select:none; position:relative;
  }
  .product-card:active{transform:scale(.97);}
  .p-img-wrap{width:100%; height:110px; border-radius:12px; background:var(--card2); overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .p-img-wrap img{width:100%; height:100%; object-fit:cover;}
  .p-img-wrap svg{width:36px; height:36px; color:var(--text2); opacity:.5;}
  .p-name{font-size:14.5px; font-weight:600; line-height:1.3; margin-top:4px;}
  .p-sub{font-size:12px; color:var(--text2);}
  .p-price{font-size:15px; font-weight:700; color:var(--accent); margin-top:2px;}
  .stock-badge{position:absolute; top:10px; left:10px; font-size:10px; padding:2px 7px; border-radius:100px; background:var(--card2); color:var(--text2); font-weight:600; z-index:2;}
  .stock-badge.low{color:#fff; background:var(--danger);}

  .section-title{font-size:20px; font-weight:700; margin:14px 2px 6px;}
  .list-row{
    background:var(--card); border-radius:var(--radius); padding:12px 14px; display:flex; align-items:center;
    justify-content:space-between; gap:10px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .list-row .info{display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; cursor:pointer;}
  .list-row .title{font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .list-row .sub{font-size:12.5px; color:var(--text2);}
  .row-actions{display:flex; gap:6px; flex:none;}
  .mini-btn{border:none; background:var(--card2); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer;}
  .mini-btn svg{width:15px; height:15px;}
  .mini-btn.danger{color:var(--danger);}

  .fab{
    position:fixed; left:16px; bottom:calc(96px + var(--safe-b)); width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; box-shadow:0 6px 16px rgba(0,122,255,.4); display:flex;
    align-items:center; justify-content:center; z-index:15; cursor:pointer;
  }
  .fab svg{width:24px; height:24px;}
  .fab:active{transform:scale(.93);}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto;
    background:var(--tab-bg); backdrop-filter:var(--nav-blur); -webkit-backdrop-filter:var(--nav-blur);
    border-top:1px solid var(--divider); display:flex; padding:8px 4px calc(8px + var(--safe-b)); z-index:20;
  }
  nav.tabbar button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text2); font-size:10.5px; cursor:pointer; padding:4px 0;
  }
  nav.tabbar button svg{width:23px; height:23px;}
  nav.tabbar button.active{color:var(--accent);}

  .cart-bar{
    position:fixed; bottom:calc(70px + var(--safe-b)); left:16px; right:16px; max-width:528px; margin:0 auto;
    background:var(--accent); color:#fff; border-radius:16px; padding:13px 16px; display:flex; align-items:center;
    justify-content:space-between; box-shadow:0 8px 20px rgba(0,122,255,.35); z-index:16; cursor:pointer;
  }
  .cart-bar b{font-size:14px;}
  .cart-bar .badge{background:rgba(255,255,255,.25); border-radius:100px; padding:2px 9px; font-size:12px; margin-left:6px;}

  .sheet-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; display:none; align-items:flex-end; justify-content:center;}
  .sheet-overlay.show{display:flex;}
  .sheet-overlay.centered{align-items:center;}
  .sheet{
    background:var(--bg); width:100%; max-width:560px; border-radius:20px 20px 0 0; padding:10px 18px 28px;
    max-height:88vh; overflow-y:auto; animation:up .25s ease;
  }
  .sheet-overlay.centered .sheet{border-radius:20px; max-width:480px; animation:pop .18s ease;}
  @keyframes up{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  @keyframes pop{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}
  .sheet-handle{width:36px; height:5px; background:var(--divider); border-radius:100px; margin:4px auto 14px;}
  .sheet-overlay.centered .sheet-handle{display:none;}
  .sheet h2{font-size:19px; margin:0 0 14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text2); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--divider); background:var(--card);
    color:var(--text); font-size:15px; outline:none;
  }
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  .btn{
    width:100%; padding:14px; border-radius:14px; border:none; background:var(--accent); color:#fff; font-size:16px;
    font-weight:600; cursor:pointer;
  }
  .btn.secondary{background:var(--card2); color:var(--text);}
  .btn.danger{background:var(--danger); color:#fff;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn:active{transform:scale(.98);}
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn-small{padding:9px 16px; border-radius:12px; border:none; background:var(--accent); color:#fff; font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .btn-small svg{width:15px; height:15px;}

  .cart-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--divider);}
  .cart-line .ci-info{flex:1; min-width:0;}
  .cart-line .ci-name{font-size:14.5px; font-weight:600;}
  .cart-line .ci-price{font-size:12.5px; color:var(--text2);}
  .qty-ctrl{display:flex; align-items:center; gap:8px; background:var(--card2); border-radius:100px; padding:4px 8px;}
  .qty-ctrl button{border:none; background:none; width:22px; height:22px; color:var(--accent); font-size:17px; font-weight:700; cursor:pointer;}
  .qty-ctrl span{min-width:16px; text-align:center; font-size:14px; font-weight:600;}
  .cart-total-row{display:flex; justify-content:space-between; padding:14px 0; font-size:16px; font-weight:700;}

  .switch{position:relative; width:51px; height:31px; flex:none;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--divider); border-radius:100px; cursor:pointer; transition:.2s;}
  .slider:before{content:""; position:absolute; width:27px; height:27px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch input:checked + .slider{background:var(--accent2);}
  [dir="rtl"] .switch input:checked + .slider:before{transform:translateX(-20px);}

  .empty{text-align:center; color:var(--text2); padding:50px 20px; font-size:14.5px;}
  .empty svg{width:48px; height:48px; margin-bottom:10px; opacity:.5;}

  .settings-row{display:flex; align-items:center; justify-content:space-between; background:var(--card); padding:14px; border-radius:var(--radius); margin-bottom:10px; box-shadow:var(--shadow);}
  .settings-row .label{font-size:15px; font-weight:500;}
  .settings-row .label .d{font-size:12px; color:var(--text2); margin-top:2px;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
  .stat-card{background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
  .stat-card .v{font-size:22px; font-weight:700;}
  .stat-card .l{font-size:12.5px; color:var(--text2); margin-top:2px;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .bar-row .bl{width:110px; font-size:13px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{flex:1; height:10px; background:var(--card2); border-radius:100px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:100px;}
  .bar-val{font-size:12.5px; color:var(--text2); flex:none; width:50px; text-align:left;}

  .chart-box{background:var(--card); border-radius:var(--radius); padding:16px; margin-top:14px; box-shadow:var(--shadow);}
  .chart-box h4{margin:0 0 12px; font-size:15px;}

  .toast{
    position:fixed; bottom:calc(100px + var(--safe-b)); left:50%; transform:translateX(-50%); background:var(--text);
    color:var(--bg); padding:10px 18px; border-radius:100px; font-size:13.5px; z-index:60; opacity:0; transition:opacity .25s, transform .25s;
    pointer-events:none; white-space:nowrap; max-width:90%; overflow:hidden; text-overflow:ellipsis;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .loading{display:flex; align-items:center; justify-content:center; height:70vh; color:var(--text2); font-size:14px;}

  .scanner-wrap{position:fixed; inset:0; background:#000; z-index:50; display:none; flex-direction:column;}
  .scanner-wrap.show{display:flex;}
  .scanner-top{display:flex; justify-content:space-between; align-items:center; padding:16px; color:#fff;}
  .scanner-video-box{position:relative; flex:1; overflow:hidden; max-width:640px; width:100%; margin:0 auto;}
  .scanner-video-box video{width:100%; height:100%; object-fit:cover;}
  .scan-frame{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:70%; aspect-ratio:1; border:3px solid #fff; border-radius:20px; box-shadow:0 0 0 2000px rgba(0,0,0,.45);}
  .scanner-hint{color:#fff; text-align:center; padding:16px; font-size:13.5px; opacity:.8;}

  #desktopApp{display:flex; min-height:100vh;}
  .dash-sidebar{
    width:232px; flex:none; background:var(--card); border-inline-end:1px solid var(--divider);
    padding:20px 14px; display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .dash-logo{display:flex; align-items:center; gap:10px; padding:8px 10px 22px; font-size:18px; font-weight:700;}
  .dash-logo span.dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none;}
  .dash-nav-group{font-size:11px; color:var(--text2); font-weight:600; padding:14px 12px 6px;}
  .dash-nav-btn{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:11px; border:none;
    background:transparent; color:var(--text2); font-size:14px; cursor:pointer; text-align:right; width:100%;
  }
  .dash-nav-btn svg{width:19px; height:19px; flex:none;}
  .dash-nav-btn:hover{background:var(--card2);}
  .dash-nav-btn.active{background:var(--accent); color:#fff;}
  .dash-sidebar-bottom{margin-top:auto; padding-top:14px; border-top:1px solid var(--divider);}

  .dash-main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .dash-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 32px;
    border-bottom:1px solid var(--divider); position:sticky; top:0; background:var(--bg); z-index:5;
  }
  .dash-topbar h1{font-size:21px; margin:0; font-weight:700;}
  .dash-topbar-actions{display:flex; align-items:center; gap:10px;}
  .dash-search{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--divider);
    border-radius:11px; padding:8px 12px; width:260px; color:var(--text2);
  }
  .dash-search input{border:none; outline:none; background:transparent; color:var(--text); font-size:14px; width:100%;}
  .dash-search svg{width:15px; height:15px; flex:none;}

  .dash-content{padding:26px 32px 50px; flex:1;}
  .dash-toolbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px;}
  .dash-chips{display:flex; gap:8px; flex-wrap:wrap;}

  .pos-layout{display:flex; gap:22px; align-items:flex-start;}
  .pos-products{flex:1; min-width:0;}
  .pos-products .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px;}
  .order-panel{
    width:340px; flex:none; background:var(--card); border-radius:var(--radius); padding:18px;
    position:sticky; top:96px; box-shadow:var(--shadow); max-height:calc(100vh - 116px); display:flex; flex-direction:column;
  }
  .order-panel h3{margin:0 0 12px; font-size:16px; display:flex; align-items:center; justify-content:space-between;}
  .order-panel .count-pill{font-size:11.5px; background:var(--card2); color:var(--text2); padding:2px 9px; border-radius:100px; font-weight:600;}
  .order-lines{flex:1; overflow-y:auto; margin-bottom:10px; min-height:60px;}

  .dash-table-wrap{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .dash-table{width:100%; border-collapse:collapse;}
  .dash-table th{text-align:right; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--text2); font-weight:600; padding:13px 18px; border-bottom:1px solid var(--divider);}
  .dash-table td{padding:13px 18px; border-bottom:1px solid var(--divider); font-size:14px;}
  .dash-table tr:last-child td{border-bottom:none;}
  .dash-table tr:hover td{background:var(--card2);}
  .cell-main{font-weight:600;}
  .cell-sub{font-size:12px; color:var(--text2); margin-top:1px;}
  .table-actions{display:flex; gap:6px; justify-content:flex-end;}
  .pill{display:inline-block; padding:3px 10px; border-radius:100px; font-size:12px; font-weight:600; background:var(--card2); color:var(--text2);}
  .pill.low{background:var(--danger); color:#fff;}

  .dash-stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
  .dash-stat-card{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .dash-stat-card .v{font-size:24px; font-weight:700;}
  .dash-stat-card .l{font-size:12.5px; color:var(--text2); margin-top:3px;}
  .dash-panels{display:flex; gap:20px; align-items:flex-start;}
  .dash-panel{background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); flex:1;}
  .dash-panel h3{margin:0 0 14px; font-size:16px;}

  .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}

  @media print {
    body * { visibility: hidden; }
    #printableInvoice, #printableInvoice * { visibility: visible; }
    #printableInvoice { position: absolute; left: 0; top: 0; width: 100%; background: #fff; color: #000; padding: 20px; }
  }
</style>
</head>

<!-- شاشة تسجيل الدخول -->
<div id="authScreen" style="display:none;">
  <div class="auth-card">
    <h2 id="authTitle">تسجيل الدخول</h2>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email5" id="authEmail" placeholder="name@example.com">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>
    <button class="btn" id="authSubmitBtn" onclick="handleAuthSubmit()">دخول</button>
    <div class="auth-toggle" onclick="toggleAuthMode()" id="authToggleText">ليس لديك حساب؟ إنشاء حساب جديد</div>
  </div>
</div>

<div id="mobileApp" style="display:none;"><div class="loading">جاري التحميل...</div></div>
<div id="desktopApp" style="display:none;"></div>
<div id="rootLoading" class="loading">جاري التحميل...</div>

<div class="toast" id="toast"></div>
<div class="sheet-overlay" id="sheetOverlay"><div class="sheet" id="sheetContent"></div></div>

<div class="scanner-wrap" id="scannerWrap">
  <div class="scanner-top">
    <button class="icon-btn" onclick="closeScanner()" style="background:rgba(255,255,255,.15); color:#fff;">✕</button>
    <span style="font-weight:600;">امسح كود المنتج</span>
    <span style="width:36px;"></span>
  </div>
  <div class="scanner-video-box">
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-frame"></div>
  </div>
  <div class="scanner-hint">وجّه الكاميرا نحو رمز QR أو الباركود الخاص بالمنتج</div>
</div>
<canvas id="scanCanvas" style="display:none;"></canvas>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDCRbSO8WpdD92eAW5GoSyuc1vlcJP2I38",
    authDomain: "pos-app-bfc67.firebaseapp.com",
    projectId: "pos-app-bfc67",
    storageBucket: "pos-app-bfc67.firebasestorage.app",
    messagingSenderId: "468198888651",
    appId: "1:468198888651:web:cd437e7d1eaca38405f74e",
    measurementId: "G-Q4NYWJF2VD"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);

  // إتاحة أدوات الفايربيز عالمياً للاستخدام في التطبيق
  window.firebaseAuth = auth;
  window.signInWithEmailAndPassword = signInWithEmailAndPassword;
  window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
  window.signOut = signOut;

  onAuthStateChanged(auth, (user) => {
    document.getElementById('rootLoading').style.display = 'none';
    if (user) {
      document.getElementById('authScreen').style.display = 'none';
      loadAll();
    } else {
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('mobileApp').style.display = 'none';
      document.getElementById('desktopApp').style.display = 'none';
    }
  });
</script>

<script>
/* =====================================================================
   AUTH UI LOGIC
   ===================================================================== */
let isSignUpMode = false;
function toggleAuthMode(){
  isSignUpMode = !isSignUpMode;
  document.getElementById('authTitle').textContent = isSignUpMode ? 'إنشاء حساب جديد' : 'تسجيل الدخول';
  document.getElementById('authSubmitBtn').textContent = isSignUpMode ? 'إنشاء حساب' : 'دخول';
  document.getElementById('authToggleText').textContent = isSignUpMode ? 'لديك حساب بالفعل؟ تسجيل الدخول' : 'ليس لديك حساب؟ إنشاء حساب جديد';
}

async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  if(!email || !password){ toast('الرجاء إدخال البريد وكلمة المرور'); return; }
  try {
    if(isSignUpMode){
      await window.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
      toast('تم إنشاء الحساب وتسجيل الدخول بنجاح');
    } else {
      await window.signInWithEmailAndPassword(window.firebaseAuth, email, password);
      toast('تم تسجيل الدخول بنجاح');
    }
  } catch(e){
    toast('خطأ: ' + e.message);
  }
}

async function handleLogout(){
  if(confirm('هل تريد تسجيل الخروج؟')){
    await window.signOut(window.firebaseAuth);
    toast('تم تسجيل الخروج');
  }
}

/* =====================================================================
   SOUND EFFECTS SYSTEM (Web Audio API - Professional Tone)
   ===================================================================== */
let audioCtx = null;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(type){
  try{
    initAudio();
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if(type === 'click'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(120, now + 0.04);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      osc.start(now);
      osc.stop(now + 0.04);
    } else if(type === 'success'){
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if(type === 'delete'){
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    }
  }catch(e){console.error(e);}
}

async function sGet(key, fallback){
  try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }
  catch(e){ return fallback; }
}
async function sSet(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), false); }
  catch(e){ console.error('storage set failed', key, e); }
}

async function loadAll(){
  const [products, customers, sales, settings, categories] = await Promise.all([
    sGet('products', null), sGet('customers', []), sGet('sales', []), sGet('settings', null), sGet('categories', null)
  ]);
  state.products = products || seedProducts();
  if(!products) sSet('products', state.products);
  state.customers = customers;
  state.sales = sales;
  state.categories = categories || defaultCategories;
  if(!categories) sSet('categories', state.categories);
  state.theme = (settings && settings.theme) || 'light';
  state.currency = (settings && settings.currency) || 'ج.م';
  document.body.setAttribute('data-theme', state.theme);
  render();
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}

function openSheet(html){
  const overlay = document.getElementById('sheetOverlay');
  overlay.classList.toggle('centered', isDesktop);
  document.getElementById('sheetContent').innerHTML = `<div class="sheet-handle"></div>${html}`;
  overlay.classList.add('show');
}
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('show'); }
document.getElementById('sheetOverlay').addEventListener('click', e=>{ if(e.target.id==='sheetOverlay') closeSheet(); });

function render(){
  document.getElementById('mobileApp').style.display = isDesktop ? 'none' : 'block';
  document.getElementById('desktopApp').style.display = isDesktop ? 'flex' : 'none';
  if(isDesktop) renderDesktop(); else renderMobile();
}
function switchView(v){
  playSound('click');
  state.view=v; render();
}

function renderSalesGrid(){
  return `<div id="productsGridContainer">${renderSalesGridContent()}</div>`;
}

function renderSalesGridContent(){
  let list = state.products.filter(p=> state.cat==='الكل' || p.category===state.cat);
  const q = (state.search||'').trim();
  if(q) list = list.filter(p=> p.name.includes(q));
  if(!list.length) return `<div class="empty">${ICONS.box2}<div>لا توجد منتجات مطابقة</div></div>`;
  return `<div class="grid">${list.map(p=>{
    const low = p.stock<=5;
    const imgHtml = p.image ? `<img src="${escapeAttr(p.image)}" alt="${escapeAttr(p.name)}">` : ICONS.box2;
    return `<div class="product-card" onclick="addToCart('${p.id}')">
      <span class="stock-badge ${low?'low':''}">${p.stock} متبقي</span>
      <div class="p-img-wrap">${imgHtml}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-sub">${p.category}</div>
      <div class="p-price">${p.price} ${state.currency}</div>
    </div>`;
  }).join('')}</div>`;
}

function filterProductsDOM(){
  const container = document.getElementById('productsGridContainer');
  if(container) container.innerHTML = renderSalesGridContent();
}

function addToCart(id){
  const p = state.products.find(x=>x.id===id);
  if(!p) return;
  if(p.stock<=0){ toast('الكمية غير متوفرة في المخزون'); return; }
  playSound('click');
  const line = state.cart.find(l=>l.id===id);
  if(line){
    if(line.qty>=p.stock){ toast('لا يوجد مخزون كافٍ'); return; }
    line.qty++;
  } else state.cart.push({id, qty:1});
  
  if(isDesktop){
    const panel = document.getElementById('orderPanelContainer');
    if(panel) panel.innerHTML = renderOrderPanel();
    if(document.getElementById('mobileApp').style.display !== 'none') render();
  } else {
    render();
  }
  toast(`أُضيف: ${p.name}`);
}
function cartTotal(){
  return state.cart.reduce((sum,l)=>{
    const p = state.products.find(x=>x.id===l.id);
    return sum + (p? p.price*l.qty : 0);
  },0);
}
function changeQty(id, delta){
  playSound('click');
  const line = state.cart.find(l=>l.id===id);
  const p = state.products.find(x=>x.id===id);
  if(!line) return;
  line.qty += delta;
  if(line.qty > p.stock){ line.qty = p.stock; toast('لا يوجد مخزون كافٍ'); }
  if(line.qty<=0) state.cart = state.cart.filter(l=>l.id!==id);
  
  if(isDesktop){
    const panel = document.getElementById('orderPanelContainer');

async function confirmSale(){
  if(!state.cart.length) return;
  const items = state.cart.map(l=>{
    const p = state.products.find(x=>x.id===l.id);
    p.stock -= l.qty;
    return {id:p.id, name:p.name, price:p.price, qty:l.qty};
  });
  const sale = {
    id: uid(),
    items,
    total: cartTotal(),
    customerId: state.selectedCustomerId,
    payMethod: window.__payMethod || 'نقدي',
    date: new Date().toISOString()
  };
  state.sales.push(sale);
  state.cart = [];
  state.selectedCustomerId = null;
  await Promise.all([sSet('products', state.products), sSet('sales', state.sales)]);
  playSound('success');
  closeSheet();
  render();
  toast('تم الدفع بنجاح ✓');

function computeReportData(){
  const today = new Date().toDateString();
  const todaySales = state.sales.filter(s=> new Date(s.date).toDateString()===today);
  const todayTotal = todaySales.reduce((s,x)=>s+x.total,0);
  const totalAll = state.sales.reduce((s,x)=>s+x.total,0);
  
  const qtyMap = {};
  state.sales.forEach(s=> s.items.forEach(it=>{ qtyMap[it.name]=(qtyMap[it.name]||0)+it.qty; }));
  const top = Object.entries(qtyMap).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const monthlyMap = {};
  const yearlyMap = {};
  state.sales.forEach(s=>{
    const d = new Date(s.date);
    const mKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const yKey = `${d.getFullYear()}`;
    monthlyMap[mKey] = (monthlyMap[mKey]||0) + s.total;
    yearlyMap[yKey] = (yearlyMap[yKey]||0) + s.total;
  });

  const months = Object.entries(monthlyMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);
  const years = Object.entries(yearlyMap).sort((a,b)=>a[0].localeCompare(b[0]));

  return {todaySales, todayTotal, totalAll, top, months, years};
}

function filteredSalesList(){
  const q = (state.invoiceSearch || '').trim().toLowerCase();
  let list = [...state.sales].reverse();
  if(!q) return list;
  return list.filter(s=>{
    const cust = state.customers.find(c=>c.id===s.customerId);
    const cName = cust ? cust.name.toLowerCase() : 'نقدي';
    const dateStr = new Date(s.date).toLocaleString('ar-EG').toLowerCase();
    const idStr = s.id.toLowerCase();
    return idStr.includes(q) || cName.includes(q) || dateStr.includes(q) || s.payMethod.toLowerCase().includes(q);
  });
}

}

function renderReportsMobileListContent(list){
  if(!list.length) return `<div class="empty">لا توجد فواتير مطابقة</div>`;
  return list.map(s=>{
    const cust = state.customers.find(c=>c.id===s.customerId);
    const cName = cust ? cust.name : 'عميل نقدي';
    const timeStr = new Date(s.date).toLocaleString('ar-EG');
    return `<div class="list-row" onclick="openInvoiceDetails('${s.id}')">
      <div class="info">
        <div class="title">فاتورة #${s.id.toUpperCase()} — ${cName}</div>
        <div class="sub">${timeStr} · ${s.payMethod}</div>
      </div>
      <div style="font-weight:700; color:var(--accent); font-size:15px; flex:none;">${s.total} ${state.currency}</div>
    </div>`;
  }).join('');
}

function renderReportsMobileListDOM(){
  const container = document.getElementById('mobileInvoiceListContainer');
  if(container) container.innerHTML = renderReportsMobileListContent(filteredSalesList());
}

function renderReportsDashboard(){
  const {todaySales, todayTotal, totalAll, top, months, years} = computeReportData();
  const maxQty = top.length? top[0][1] : 1;
  const maxMonthVal = months.length ? Math.max(...months.map(m=>m[1])) : 1;
  const maxYearVal = years.length ? Math.max(...years.map(y=>y[1])) : 1;
  const recent = filteredSalesList();

  return `
    <div class="dash-stat-row">
      <div class="dash-stat-card"><div class="v">${todayTotal} ${state.currency}</div><div class="l">مبيعات اليوم</div></div>
      <div class="dash-stat-card"><div class="v">${todaySales.length}</div><div class="l">فواتير اليوم</div></div>
      <div class="dash-stat-card"><div class="v">${totalAll} ${state.currency}</div><div class="l">إجمالي المبيعات</div></div>
      <div class="dash-stat-card"><div class="v">${state.sales.length}</div><div class="l">إجمالي الفواتير</div></div>
    </div>
    <div class="dash-panels">
      <div class="dash-panel">
        <h3>الأكثر مبيعًا</h3>
        ${top.length? top.map(([name,qty])=>`<div class="bar-row"><div class="bl">${name}</div><div class="bar-track"><div class="bar-fill" style="width:${(qty/maxQty*100).toFixed(0)}%"></div></div><div class="bar-val">${qty}</div></div>`).join('') : `<div class="empty">لا توجد بيانات بعد</div>`}
      </div>
      <div class="dash-panel">
        <h3>المبيعات الشهرية والسنوية</h3>
        <div style="font-weight:600; font-size:13px; margin-bottom:6px; color:var(--text2);">شهرياً</div>
        ${months.length ? months.map(([m,val])=>`<div class="bar-row"><div class="bl">${m}</div><div class="bar-track"><div class="bar-fill" style="width:${(val/maxMonthVal*100).toFixed(0)}%; background:var(--accent2);"></div></div><div class="bar-val" style="width:60px;">${val}</div></div>`).join('') : ''}
        <div style="font-weight:600; font-size:13px; margin:14px 0 6px; color:var(--text2);">سنوياً</div>
        ${years.length ? years.map(([y,val])=>`<div class="bar-row"><div class="bl">${y}</div><div class="bar-track"><div class="bar-fill" style="width:${(val/maxYearVal*100).toFixed(0)}%; background:var(--warn);"></div></div><div class="bar-val" style="width:60px;">${val}</div></div>`).join('') : ''}
      </div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px; margin-bottom:12px;">
      <div class="section-title" style="margin:0;">سجل الفواتير الكامل</div>
      <div class="dash-search" style="width:300px;">
        ${ICONS.search}
        <input id="desktopInvoiceSearch" placeholder="ابحث برقم الفاتورة، العميل، التاريخ..." value="${escapeAttr(state.invoiceSearch)}" oninput="state.invoiceSearch=this.value; renderReportsDesktopTableDOM()">
      </div>
    </div>
    <div id="desktopInvoiceTableContainer">${renderReportsDesktopTableContent(recent)}</div>
  `;
}

function renderReportsDesktopTableContent(list){
  if(!list.length) return `<div class="empty">لا توجد فواتير مطابقة</div>`;
  const rows = list.map(s=>{
    const cust = state.customers.find(c=>c.id===s.customerId);
    return `<tr>
      <td class="cell-main">#${s.id.toUpperCase()}</td>
      <td>${new Date(s.date).toLocaleString('ar-EG')}</td>
      <td>${cust ? cust.name : 'نقدي'}</td>
      <td>${s.payMethod}</td>
      <td style="font-weight:700; color:var(--accent);">${s.total} ${state.currency}</td>
      <td><button class="btn-small" onclick="openInvoiceDetails('${s.id}')" style="padding:5px 10px; font-size:12px;">التفاصيل</button></td>
    </tr>`;
  }).join('');
  return `<div class="dash-table-wrap"><table class="dash-table">
    <thead><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>العميل</th><th>طريقة الدفع</th><th>الإجمالي</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderReportsDesktopTableDOM(){
  const container = document.getElementById('desktopInvoiceTableContainer');
  if(container) container.innerHTML = renderReportsDesktopTableContent(filteredSalesList());
}

function openInvoiceDetails(saleId){
  playSound('click');
  const s = state.sales.find(x=>x.id===saleId);
  if(!s) return;
  const cust = state.customers.find(c=>c.id===s.customerId);
  const itemsHtml = s.items.map(i=>`
    <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--divider);">
      <div><b>${i.name}</b> <span style="font-size:12px; color:var(--text2);">(${i.qty} × ${i.price} ${state.currency})</span></div>
      <div style="font-weight:600;">${i.qty * i.price} ${state.currency}</div>
    </div>
  `).join('');

  openSheet(`
    <div id="printableInvoice">
      <h2>تفاصيل الفاتورة #${s.id.toUpperCase()}</h2>
      <div style="font-size:13px; color:var(--text2); margin-bottom:14px;">
        التاريخ: ${new Date(s.date).toLocaleString('ar-EG')}<br>
        العميل: ${cust ? cust.name : 'عميل نقدي'} (${cust && cust.phone ? cust.phone : 'بدون هاتف'})<br>
        طريقة الدفع: ${s.payMethod}
      </div>
      <div style="max-height:30vh; overflow-y:auto; margin-bottom:14px;">${itemsHtml}</div>
      <div class="cart-total-row" style="border-top:2px solid var(--divider);"><span>الإجمالي النهائي</span><span>${s.total} ${state.currency}</span></div>
    </div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn" onclick="window.print()">طباعة / حفظ PDF</button>
      <button class="btn secondary" onclick="closeSheet()">إغلاق</button>
    </div>
  `);
}

function settingsCardsHtml(){
  const catsHtml = state.categories.map(c=>`
    <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--divider);">
      <span>${c}</span>
      <div style="display:flex; gap:6px;">
        <button class="mini-btn" onclick="openEditCategory('${escapeAttr(c)}')">${ICONS.edit}</button>
        <button class="mini-btn danger" onclick="deleteCategory('${escapeAttr(c)}')">${ICONS.trash}</button>
      </div>
    </div>
  `).join('');

  return `
    <div class="settings-row">
      <div class="label">الوضع الداكن<div class="d">تفعيل المظهر الداكن للتطبيق</div></div>
      <label class="switch"><input type="checkbox" ${state.theme==='dark'?'checked':''} onchange="toggleTheme()"><span class="slider"></span></label>
    </div>
    <div class="settings-row">
      <div class="label">العملة</div>
      <select onchange="changeCurrency(this.value)" style="border:1px solid var(--divider); background:var(--card2); color:var(--text); padding:8px 10px; border-radius:10px;">
        ${['ج.م','$','ر.س','د.إ'].map(c=>`<option ${state.currency===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="settings-row" style="flex-direction:column; align-items:stretch; gap:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="label">إدارة التصنيفات</div>
        <button class="btn-small" onclick="openAddCategory()">${ICONS.plus}تصنيف جديد</button>
      </div>
      <div style="max-height:180px; overflow-y:auto;">${catsHtml}</div>
    </div>
    <div class="settings-row" onclick="handleLogout()" style="cursor:pointer;">
      <div class="label" style="color:var(--danger);">تسجيل الخروج من الحساب</div><span style="color:var(--text2);">›</span>
    </div>`;
}
function renderSettingsBody(){
  return settingsCardsHtml() + `<div class="empty" style="padding-top:20px;">نقطة البيع - نسخة ويب مبسطة</div>`;
}
function renderSettingsDashboard(){
  return `<div class="settings-grid" style="max-width:640px;">${settingsCardsHtml()}</div>`;
}

function openAddCategory(){
  playSound('click');
  openSheet(`
    <h2>إضافة تصنيف جديد</h2>
    <div class="field"><label>اسم التصنيف</label><input id="newCatName" placeholder="مثال: مشروبات ساخنة"></div>
    <button class="btn" onclick="saveNewCategory()">إضافة</button>
    <div class="btn-row"><button class="btn secondary" onclick="closeSheet()">إلغاء</button></div>
  `);
}
async function saveNewCategory(){
  const name = document.getElementById('newCatName').value.trim();
  if(!name){ toast('الرجاء إدخال اسم التصنيف'); return; }
  if(state.categories.includes(name)){ toast('هذا التصنيف موجود مسبقاً'); return; }
  state.categories.push(name);
  await sSet('categories', state.categories);
  playSound('success');
  closeSheet(); render(); toast('تمت إضافة التصنيف بنجاح');
}

function openEditCategory(oldName){
  playSound('click');
  openSheet(`
    <h2>تعديل التصنيف</h2>
    <div class="field"><label>اسم التصنيف الجديد</label><input id="editCatName" value="${escapeAttr(oldName)}"></div>
    <button class="btn" onclick="updateCategory('${escapeAttr(oldName)}')">حفظ التعديل</button>
    <div class="btn-row"><button class="btn secondary" onclick="closeSheet()">إلغاء</button></div>
  `);
}
async function updateCategory(oldName){
  const newName = document.getElementById('editCatName').value.trim();
  if(!newName){ toast('الرجاء إدخال اسم التصنيف'); return; }
  if(newName === oldName){ closeSheet(); return; }
  if(state.categories.includes(newName)){ toast('هذا التصنيف موجود مسبقاً'); return; }
  
  const idx = state.categories.indexOf(oldName);
  if(idx !== -1) state.categories[idx] = newName;
  
  state.products.forEach(p=>{
    if(p.category === oldName) p.category = newName;
  });
  if(state.cat === oldName) state.cat = newName;

  await Promise.all([sSet('categories', state.categories), sSet('products', state.products)]);
  playSound('success');
  closeSheet(); render(); toast('تم تعديل التصنيف بنجاح');
}

async function deleteCategory(catName){
  if(state.categories.length <= 1){ toast('يجب أن يبقى تصنيف واحد على الأقل'); return; }
  if(!confirm(`هل أنت متأكد من حذف التصنيف "${catName}"؟ سيتم نقل المنتجات التابعة له إلى أول تصنيف متاحة.`)) return;
  playSound('delete');
  
  state.categories = state.categories.filter(c => c !== catName);
  const fallbackCat = state.categories[0];
  state.products.forEach(p=>{
    if(p.category === catName) p.category = fallbackCat;
  });
  if(state.cat === catName) state.cat = 'الكل';

  await Promise.all([sSet('categories', state.categories), sSet('products', state.products)]);
  render(); toast('تم حذف التصنيف');
}

async function toggleTheme(){
  playSound('click');
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', state.theme);
  await sSet('settings', {theme:state.theme, currency:state.currency});
  render();
}
async function changeCurrency(val){
  playSound('click');
  state.currency = val;
  await sSet('settings', {theme:state.theme, currency:state.currency});
  render();
}

let scanStream, scanRAF;
async function openScanner(){
  playSound('click');
  document.getElementById('scannerWrap').classList.add('show');
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video = document.getElementById('scanVideo');
    video.srcObject = scanStream;
    await video.play();
    scanLoop();
  }catch(e){
    toast('تعذّر الوصول للكاميرا — تأكد من إذن الوصول');
    closeScanner();
  }
}
function scanLoop(){
  const video = document.getElementById('scanVideo');
  const canvas = document.getElementById('scanCanvas');
  if(video.readyState===video.HAVE_ENOUGH_DATA){
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const img = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = window.jsQR ? jsQR(img.data, img.width, img.height) : null;
    if(code && code.data){ onScanResult(code.data); return; }
  }
  scanRAF = requestAnimationFrame(scanLoop);
}
function onScanResult(data){
  closeScanner();
  const p = state.products.find(pr=> pr.code===data.trim());
  if(p){ addToCart(p.id); }
  else toast(`لم يتم العثور على منتج بالكود: ${data.slice(0,20)}`);
}
function closeScanner(){
  document.getElementById('scannerWrap').classList.remove('show');
  cancelAnimationFrame(scanRAF);
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
}

function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
</script>
